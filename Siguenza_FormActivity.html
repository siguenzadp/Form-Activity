<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siguenza - HTML Form Activity</title>
</head>
<body>
    <h1>HTML Form</h1>
    <form action="#" method="post">
        <fieldset>
        
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Juan Dela Cruz">
            
            <br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </fieldset>

        <br>

        <fieldset>
            <legend>Gender:</legend>
            <input type="radio" id="gender-male" name="gender" value="male">
            <label for="gender_male">Male</label>
            
            <input type="radio" id="gender-female" name="gender" value="female">
            <label for="gender_female">Female</label>
            
            <input type="radio" id="gender-other" name="gender" value="other">
            <label for="gender_other">Other</label>
        </fieldset>

        <br>
        
        <fieldset>
            <legend>Hobbies:</legend>
            <br>
            <input type="checkbox" id="hobby-gaming" name="hobby" value="gaming">
            <label for="gaming">Gaming</label>
            <br>
            <input type="checkbox" id="hobby-football" name="hobby" value="football">
            <label for="football">Football</label>
            <br>
            <input type="checkbox" id="hobby-cooking" name="hobby" value="cooking">
            <label for="cooking">Cooking</label>
        </fieldset>
        
        <br>
        
        <label for="additional-comment">Additional Comments:</label>
        <br>
        <textarea id="additional-comment" name="additional-comment" rows="5" cols="40" placeholder="Write your comments here..."></textarea>

        <br>

        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
